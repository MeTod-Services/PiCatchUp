[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picatchup"
dynamic = ["version"]
description = "Private, class-scoped lesson catch-up assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PiCatchUp contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
picatchup = "picatchup.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "picatchup.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["picatchup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]  # Frozen T-S01 enums intentionally retain str/Enum behavior.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["picatchup"]
mypy_path = "src"
